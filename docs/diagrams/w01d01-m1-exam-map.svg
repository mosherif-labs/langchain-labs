<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 1226 625" width="1226" height="625" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-10" width="1226" height="625" fill="#ffffff"/><rect x="20" y="60" width="280" height="300" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#a5d8ff"/><rect x="320" y="60" width="280" height="300" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb"/><rect x="620" y="60" width="280" height="300" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffec99"/><rect x="920" y="60" width="280" height="300" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffc9c9"/><rect x="20" y="385" width="580" height="120" rx="12" stroke="#2f9e44" stroke-width="2" fill="#ebfbee"/><rect x="620" y="385" width="580" height="120" rx="12" stroke="#e03131" stroke-width="2" fill="#fff5f5"/><rect x="20" y="525" width="1180" height="70" rx="12" stroke="#868e96" stroke-width="2" fill="#f1f3f5" stroke-dasharray="8 6"/><text x="20.0" y="34.0" font-size="24" fill="#1e1e1e" text-anchor="start">LCAE exam map  ·  2 hours  ·  40 questions  ·  ~3 min each</text><text x="34.0" y="90.0" font-size="18" fill="#1e1e1e" text-anchor="start">1 · BUILD  (10 Qs, 25%)</text><text x="34.0" y="125.0" font-size="15" fill="#1e1e1e" text-anchor="start">• create_agent vs deepagents</text><text x="34.0" y="143.8" font-size="15" fill="#1e1e1e" text-anchor="start">• Middleware</text><text x="34.0" y="162.5" font-size="15" fill="#1e1e1e" text-anchor="start">• Context engineering</text><text x="34.0" y="181.2" font-size="15" fill="#1e1e1e" text-anchor="start">  (long-running agents)</text><text x="34.0" y="200.0" font-size="15" fill="#1e1e1e" text-anchor="start">• AGENTS.md and SKILL.md</text><text x="34.0" y="218.8" font-size="15" fill="#1e1e1e" text-anchor="start">• Sandboxing</text><text x="334.0" y="90.0" font-size="18" fill="#1e1e1e" text-anchor="start">2 · TEST  (10 Qs, 25%)</text><text x="334.0" y="125.0" font-size="15" fill="#1e1e1e" text-anchor="start">• Code evaluators vs LLM-as-judge</text><text x="334.0" y="143.8" font-size="15" fill="#1e1e1e" text-anchor="start">• Online vs offline evaluators</text><text x="334.0" y="162.5" font-size="15" fill="#1e1e1e" text-anchor="start">• Run + interpret experiments</text><text x="334.0" y="181.2" font-size="15" fill="#1e1e1e" text-anchor="start">• Evaluator alignment</text><text x="334.0" y="200.0" font-size="15" fill="#1e1e1e" text-anchor="start">• Add examples to a dataset</text><text x="634.0" y="90.0" font-size="18" fill="#1e1e1e" text-anchor="start">3 · DEPLOY  (10 Qs, 25%)</text><text x="634.0" y="125.0" font-size="15" fill="#1e1e1e" text-anchor="start">• graph / deployment / revision /</text><text x="634.0" y="143.8" font-size="15" fill="#1e1e1e" text-anchor="start">  assistant / thread / run</text><text x="634.0" y="162.5" font-size="15" fill="#1e1e1e" text-anchor="start">• Multi-region serving</text><text x="634.0" y="181.2" font-size="15" fill="#1e1e1e" text-anchor="start">• Secret handling</text><text x="634.0" y="200.0" font-size="15" fill="#1e1e1e" text-anchor="start">• Authentication vs authorization</text><text x="634.0" y="218.8" font-size="15" fill="#1e1e1e" text-anchor="start">• Storage durability</text><text x="934.0" y="90.0" font-size="18" fill="#1e1e1e" text-anchor="start">4 · MONITOR  (10 Qs, 25%)</text><text x="934.0" y="125.0" font-size="15" fill="#1e1e1e" text-anchor="start">• Reading traces</text><text x="934.0" y="143.8" font-size="15" fill="#1e1e1e" text-anchor="start">• Grouping traces into threads</text><text x="934.0" y="162.5" font-size="15" fill="#1e1e1e" text-anchor="start">• Tracking costs + user sentiment</text><text x="934.0" y="181.2" font-size="15" fill="#1e1e1e" text-anchor="start">• Online Evals vs Insights</text><text x="934.0" y="200.0" font-size="15" fill="#1e1e1e" text-anchor="start">• Alerting</text><text x="34.0" y="410.0" font-size="15" fill="#1e1e1e" text-anchor="start">ALLOWED (only these 3 sites)</text><text x="34.0" y="428.8" font-size="15" fill="#1e1e1e" text-anchor="start">• smith.langchain.com</text><text x="34.0" y="447.5" font-size="15" fill="#1e1e1e" text-anchor="start">• docs.langchain.com  (its search box = your only search)</text><text x="34.0" y="466.2" font-size="15" fill="#1e1e1e" text-anchor="start">• academy.langchain.com</text><text x="634.0" y="410.0" font-size="15" fill="#1e1e1e" text-anchor="start">NOT ALLOWED</text><text x="634.0" y="428.8" font-size="15" fill="#1e1e1e" text-anchor="start">• web search  • AI tools  • the AI helper on docs.langchain.com</text><text x="634.0" y="447.5" font-size="15" fill="#1e1e1e" text-anchor="start">• browser agents / automation  • second screens / phones</text><text x="634.0" y="466.2" font-size="15" fill="#1e1e1e" text-anchor="start">• any outside communication</text><text x="34.0" y="550.0" font-size="15" fill="#1e1e1e" text-anchor="start">Exam day: join ≥15 min early (ID check, room scan) · &gt;10 min late = no-show, full-cost reschedule</text><text x="34.0" y="568.8" font-size="15" fill="#1e1e1e" text-anchor="start">Second invite ~2 h before: a dedicated LangSmith org you use to answer several questions (hands-on!)</text></svg>