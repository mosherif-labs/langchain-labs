<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 1000 530" width="1000" height="530" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-10" width="1000" height="530" fill="#ffffff"/><rect x="20" y="80" width="460" height="120" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff"/><polyline points="480.0,140.0 520.0,140.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="508.9,144.7 520.0,140.0 508.9,135.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="520" y="80" width="460" height="120" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#a5d8ff"/><polyline points="750.0,200.0 750.0,240.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="745.3,228.9 750.0,240.0 754.7,228.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="520" y="240" width="460" height="95" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffec99"/><polyline points="520.0,290.0 480.0,290.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="491.1,285.3 480.0,290.0 491.1,294.7" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="20" y="240" width="460" height="160" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff"/><polyline points="480.0,370.0 520.0,370.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="508.9,374.7 520.0,370.0 508.9,365.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="520" y="350" width="460" height="70" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb"/><rect x="20" y="440" width="960" height="60" rx="12" stroke="#868e96" stroke-width="2" fill="#f1f3f5" stroke-dasharray="8 6"/><text x="20.0" y="32.0" font-size="22" fill="#1e1e1e" text-anchor="start">The agent loop create_agent builds (your first trace, 2 model calls)</text><text x="20.0" y="70.0" font-size="15" fill="#495057" text-anchor="start">WHAT THE MODEL IS SENT (messages list)</text><text x="520.0" y="70.0" font-size="15" fill="#495057" text-anchor="start">WHAT COMES BACK</text><text x="34.0" y="105.0" font-size="15" fill="#1e1e1e" text-anchor="start">Call 1 → ChatAnthropic</text><text x="34.0" y="123.8" font-size="15" fill="#1e1e1e" text-anchor="start">• system: &quot;You are a helpful assistant.&quot;</text><text x="34.0" y="142.5" font-size="15" fill="#1e1e1e" text-anchor="start">• user: &quot;What is the weather in SF?&quot;</text><text x="34.0" y="161.2" font-size="15" fill="#1e1e1e" text-anchor="start">• + tool schema: get_weather(city: str)  ← built from</text><text x="34.0" y="180.0" font-size="15" fill="#1e1e1e" text-anchor="start">   your function&#x27;s name, docstring, type hints</text><text x="534.0" y="105.0" font-size="15" fill="#1e1e1e" text-anchor="start">AIMessage with a TOOL CALL (no answer yet)</text><text x="534.0" y="123.8" font-size="15" fill="#1e1e1e" text-anchor="start">  tool_calls = [ get_weather(city=&quot;San Francisco&quot;) ]</text><text x="534.0" y="142.5" font-size="15" fill="#1e1e1e" text-anchor="start"></text><text x="534.0" y="161.2" font-size="15" fill="#1e1e1e" text-anchor="start">The model only ASKS. It can&#x27;t run Python.</text><text x="534.0" y="265.0" font-size="15" fill="#1e1e1e" text-anchor="start">tools node (the agent RUNTIME, not the model)</text><text x="534.0" y="283.8" font-size="15" fill="#1e1e1e" text-anchor="start">runs your Python: get_weather(&quot;San Francisco&quot;)</text><text x="534.0" y="302.5" font-size="15" fill="#1e1e1e" text-anchor="start">→ ToolMessage: &quot;It&#x27;s always sunny in San Francisco!&quot;</text><text x="34.0" y="265.0" font-size="15" fill="#1e1e1e" text-anchor="start">Call 2 → ChatAnthropic  (the WHOLE list again)</text><text x="34.0" y="283.8" font-size="15" fill="#1e1e1e" text-anchor="start">• system prompt   (re-sent: models are stateless)</text><text x="34.0" y="302.5" font-size="15" fill="#1e1e1e" text-anchor="start">• user question</text><text x="34.0" y="321.2" font-size="15" fill="#1e1e1e" text-anchor="start">• AIMessage(tool_call)</text><text x="34.0" y="340.0" font-size="15" fill="#1e1e1e" text-anchor="start">• ToolMessage(result)</text><text x="34.0" y="358.8" font-size="15" fill="#1e1e1e" text-anchor="start"></text><text x="34.0" y="377.5" font-size="15" fill="#1e1e1e" text-anchor="start"></text><text x="534.0" y="375.0" font-size="15" fill="#1e1e1e" text-anchor="start">AIMessage with TEXT, no tool_calls</text><text x="534.0" y="393.8" font-size="15" fill="#1e1e1e" text-anchor="start">→ loop stops → result[&quot;messages&quot;][-1]</text><text x="34.0" y="465.0" font-size="15" fill="#1e1e1e" text-anchor="start">Loop rule: last AIMessage has tool_calls? → yes: run tools, append results, call the model again</text><text x="34.0" y="483.8" font-size="15" fill="#1e1e1e" text-anchor="start">                                                                 → no: that&#x27;s the final answer, stop</text></svg>